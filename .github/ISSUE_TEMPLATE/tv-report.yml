name: TV report
description: Tell us how Orbit runs on your TV.
title: "TV report: <brand and model>"
labels: ["tv-report"]
body:
  - type: markdown
    attributes:
      value: |
        Every report helps the next person with the same TV. Leave out your Wi-Fi's name, addresses, emails and codes.
  - type: input
    id: model
    attributes:
      label: TV brand and model
      description: As shown in the TV's Settings › System › About (for example Xiaomi TV A Pro, MiTV-AXFU0).
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android TV / Google TV version
  - type: dropdown
    id: result
    attributes:
      label: How did set-up go?
      options:
        - Everything worked
        - Worked, with small problems
        - Did not finish
    validations:
      required: true
  - type: dropdown
    id: undo
    attributes:
      label: Did you try Undo?
      options:
        - Not tried
        - Yes, and the TV was back as it was
        - Yes, and something did not come back
  - type: textarea
    id: notes
    attributes:
      label: What happened
      description: Anything that did not work, or apps that should be kept or switched off on this model.
  - type: input
    id: version
    attributes:
      label: Orbit version and phone
      description: Orbit's version is in the app under Settings › About. Your phone's model and Android version help too.
