name: Orbit OS CI and Android builds

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_to_play:
        description: Upload the phone app bundle to Google Play after building
        required: true
        type: boolean
        default: false
      play_track:
        description: Google Play release track (used only when publish_to_play is enabled)
        required: true
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

permissions:
  contents: read

concurrency:
  group: orbit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Source checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            phone/ui/package-lock.json
            site/package-lock.json

      - name: Build phone UI
        working-directory: phone/ui
        run: |
          npm ci
          npm test --if-present
          npm run build

      - name: Build website
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run TV app unit tests
        run: |
          chmod +x launcher/gradlew
          cd launcher
          ./gradlew :app:testReleaseUnitTest :livetv:testReleaseUnitTest

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze and test phone app
        working-directory: phone/app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  android-build:
    name: Build Android APKs
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Require build secrets
        env:
          GOOGLE_SERVICES: ${{ secrets.ORBIT_GOOGLE_SERVICES_JSON_BASE64 }}
          KEYSTORE: ${{ secrets.ORBIT_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ORBIT_KEY_PASSWORD }}
        run: |
          missing=0
          for name in GOOGLE_SERVICES KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret for ${name}."
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: phone/ui/package-lock.json

      - name: Build phone interface
        working-directory: phone/ui
        run: |
          npm ci
          npm run build

      - name: Build TV apps
        run: |
          chmod +x launcher/gradlew
          cd launcher
          ./gradlew :app:assembleRelease :livetv:assembleRelease

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Firebase Android configuration
        env:
          GOOGLE_SERVICES: ${{ secrets.ORBIT_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          printf '%s' "$GOOGLE_SERVICES" | base64 --decode > phone/app/android/app/google-services.json
          test -s phone/app/android/app/google-services.json

      - name: Restore phone release signing key
        env:
          KEYSTORE: ${{ secrets.ORBIT_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ORBIT_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > phone/app/android/app/orbit-release.jks
          cat > phone/app/android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=orbit-release.jks
          EOF
          chmod 600 phone/app/android/key.properties phone/app/android/app/orbit-release.jks

      - name: Prepare Flutter Android Gradle wrapper
        working-directory: phone/app
        run: |
          flutter pub get
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
          curl -fsSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd android
          /tmp/gradle-9.3.1/bin/gradle wrapper --gradle-version 9.3.1 --distribution-type all

      - name: Bundle TV setup assets into phone app
        run: |
          phone/app/tool/sync_ui.sh
          phone/app/tool/sync_setup.sh

      - name: Build signed phone APK
        working-directory: phone/app
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orbit-os-android-apks
          if-no-files-found: error
          retention-days: 30
          path: |
            phone/app/build/app/outputs/flutter-apk/app-release.apk
            launcher/app/build/outputs/apk/release/app-release.apk
            launcher/livetv/build/outputs/apk/release/livetv-release.apk

      - name: Build signed Android App Bundle for manual Play release
        if: github.event_name == 'workflow_dispatch'
        working-directory: phone/app
        run: flutter build appbundle --release

      - name: Upload Android App Bundle
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: orbit-phone-play-aab
          if-no-files-found: error
          retention-days: 30
          path: phone/app/build/app/outputs/bundle/release/app-release.aab

      - name: Publish phone app to Google Play
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.shiv.orbit
          releaseFiles: phone/app/build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.play_track }}
          status: completed
