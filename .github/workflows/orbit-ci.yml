name: Orbit CI

# The quality checks: the phone UI, the phone app, both TV apps and the TV tools, on every pull request into main and
# on every push to main (the owner also pushes straight to it). Nothing here signs, reads a secret or publishes, so it
# runs the same on any branch. A change that only touches site/ runs website-build.yml instead. docs/ci-cd.md
on:
  pull_request:
    branches: [main]
    paths-ignore: ['site/**']
  push:
    branches: [main]
    paths-ignore: ['site/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The toolchain Orbit is built with on the owner's Mac (phone/app/.metadata, pubspec.lock): keep them in step.
  FLUTTER_VERSION: 3.47.9
  NODE_VERSION: '20'
  JAVA_VERSION: '17'
  PYTHON_VERSION: '3.12'

jobs:
  phone-ui:
    name: Phone UI (phone/ui)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: phone/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: phone/ui/package-lock.json
      - run: npm ci
      - name: Unit tests (vitest)
        run: npm test
      - name: Build (tsc + vite)
        run: npm run build
      - name: Check the built page
        run: |
          test -s dist/index.html
          echo "dist/index.html: $(wc -c < dist/index.html | tr -d ' ') bytes"

  flutter:
    name: Phone app (phone/app)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: phone/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Asset folders
        # assets/ui and assets/setup are filled by tool/sync_ui.sh and tool/sync_setup.sh before a release build and
        # are git-ignored. The analyzer and the tests only need the folders, so the bridge-test page stands in.
        run: |
          tool/sync_ui.sh --placeholder
          mkdir -p assets/setup
      - name: Dependencies (exactly pubspec.lock)
        run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

  tv:
    name: TV apps (launcher)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the Gradle wrapper is Gradle's own
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testReleaseUnitTest :livetv:testReleaseUnitTest
      - name: Release build
        # Signed with this runner's own throwaway debug key: it proves the release build (R8, lint) still works, and
        # nothing from it is kept. The real TV builds come from android-build.yml.
        run: ./gradlew --no-daemon :app:assembleRelease :livetv:assembleRelease
      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tv-test-reports
          path: |
            launcher/app/build/reports/tests/
            launcher/livetv/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

  python:
    name: TV tools (tools, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Dependencies
        run: python -m pip install -r tools/requirements.txt pytest==8.4.2
      - name: Tests (pytest)
        run: python -m pytest tests -q
