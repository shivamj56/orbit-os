        <h1>Orbit OS: a smart TV remote that also sets up your TV</h1>
        <p>Orbit OS turns your Android phone into a smart TV remote for Google TV and Android TV, over your home Wi-Fi, and sets the TV up for you from the phone: no computer, no cables and no code. You get a calm home screen of only your apps, about 30 free Hindi Live TV channels, the preinstalled apps you pick switched off (never deleted), and one tap of Undo puts the TV back exactly as it was. It is free, with no ads and no trackers.</p>
        <p><a href="https://play.google.com/store/apps/details?id=dev.shiv.orbit">Get Orbit OS on Google Play</a> · <a href="https://github.com/shivamj56/orbit-os-site">Star it on GitHub</a></p>
        <h2>A TV remote on your phone</h2>
        <ul>
          <li>Roll the globe to move, tap for OK, hold for Home, or use a classic D-pad with Back, Home and Settings.</li>
          <li>Your phone's own volume buttons turn the TV up and down.</li>
          <li>Works on your home Wi-Fi, and from anywhere after an optional Google sign-in.</li>
        </ul>
        <h2>Set up your TV from your phone</h2>
        <p>Orbit finds your TV on the Wi-Fi, asks five plain questions, shows the whole plan before it changes anything, and sets everything up in about five minutes while you watch every step. It writes down every change first and can back up the TV's original setup to your own Google Drive.</p>
        <h2>What you need</h2>
        <p>An Android phone, and a Google TV or Android TV on the same Wi-Fi with developer options turned on (Orbit shows you how). Tested on the Xiaomi TV A Pro with Google TV 14; on other Google TV and Android TV sets Orbit offers only the changes it knows are safe.</p>
        <h2>Questions</h2>
        <h3>Do I need a computer?</h3>
        <p>No. Orbit on your phone does everything over your home Wi-Fi. You only use the TV's remote to turn on developer mode and to press Allow once.</p>
        <h3>Can I go back to how my TV was?</h3>
        <p>Yes. In Orbit, open Settings › This TV › Undo Orbit OS on this TV. Every app comes back on and the TV's own home screen returns.</p>
        <h3>Will Orbit affect my TV's warranty?</h3>
        <p>Orbit doesn't root your TV, unlock it or change its firmware. It uses Android's own developer settings, installs two ordinary apps and switches off, never deletes, the preinstalled apps you choose, and Undo puts everything back. If the TV goes for repair, use Undo everything first.</p>
        <h3>Is it really free?</h3>
        <p>Yes. No ads, no subscription and no tracking.</p>
