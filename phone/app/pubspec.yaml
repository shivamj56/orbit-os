name: orbit
description: "Orbit: the phone remote for the Family room TV. A full-screen WebView (phone/ui) over a Flutter bridge."
publish_to: 'none'

# versionName+versionCode on Android.
version: 1.6.0+9

environment:
  sdk: ^3.13.7

dependencies:
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_database: ^13.0.1
  flutter:
    sdk: flutter
  # SHA-256 for pairing with Android TVs (Google's remote protocol; tv/brands/android_tv.dart).
  crypto: ^3.0.8
  # Token and the chosen TV, under a key in the Android Keystore.
  flutter_secure_storage: ^11.2.0
  # The TV's door: plain HTTP/1.1 on the home Wi-Fi.
  google_sign_in: ^7.2.0
  http: ^1.6.0
  # Google Play's own review sheet, asked for once in the app's life, after a trial (phone/SPEC.md, "Asking for a
  # review").
  in_app_review: ^2.0.12
  # Finding the TV's `_orbit._tcp` advert (Android NsdManager; the plugin holds the multicast lock itself).
  nsd: ^5.0.1
  # Orbit Setup keeps one record per TV in app support storage.
  path_provider: ^2.1.5
  # keepAwake.
  wakelock_plus: ^1.8.2
  webview_flutter: ^4.14.1
  # Android-only WebView settings: overscroll, text zoom, media without a gesture, insets.
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # The whole interface is the page in the WebView: no Material, no icon font.
  uses-material-design: false

  assets:
    # phone/ui/dist/index.html, copied by tool/sync_ui.sh (a placeholder until the real UI is built).
    - assets/ui/
    # The page's translations, one JSON file per language (phone/SPEC.md, "Languages"), also copied by tool/sync_ui.sh.
    - assets/ui/locales/
    # The TV-side install bundle (both launcher APKs and the two scripts), copied by tool/sync_setup.sh before a
    # build. Git-ignored (the APKs must not be committed); the directory is populated by that tool.
    - assets/setup/
